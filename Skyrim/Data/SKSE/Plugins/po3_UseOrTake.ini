;SkyPrompt fork, modified 2026-11-12. Original mod by powerofthree.
;Translate the sAlternateActionLabel values below; save as UTF-8 and restart Skyrim.
;Keep section names and setting keys unchanged.

[Settings]

;Keep vanilla Take/Steal and show a separate object-attached SkyPrompt for use.
;Requires SkyPrompt API 2.0. If unavailable, the legacy hotkey behavior is used.
bUseSkyPrompt = true

;The hotkey, hold duration, and per-item iDefaultAction settings below apply only
;to legacy mode (bUseSkyPrompt = false, or SkyPrompt unavailable).
;Press hotkey + Activate key to perform alternative action. Default is Left Shift
;Hold hotkey to perform secondary action, if available.

;DXScanCodes : https://ck.uesp.net/wiki/Input_Script
iAlternateActionKey = 42

;
iAlternateActionKeyGamePad = 0

;How long should the hotkey be held down (in seconds) before switching to secondary action.
fHotkeyHoldDuration = 0.700000


[Armors]
bEnabled = true

;Default action upon activating
;0 - Take | 1 - Equip.
iDefaultAction = 0

;SkyPrompt text (also used by legacy mode). Translate this value as needed.
sAlternateActionLabel = Equip


[Weapons]
bEnabled = true

;0 - Take | 1 - Equip | 2 - Equip and Draw.
iDefaultAction = 0

;
sAlternateActionLabel = Equip

;Legacy-only secondary action label. SkyPrompt shows Equip for weapons.
sAlternateSecondaryActionLabel = Equip and Draw


[Potions]
bEnabled = true

;0 - Take | 1 - Drink potion/Eat food/Apply poison.
iDefaultAction = 0

;
sAlternateActionLabel = Drink

;Activate label for eating food.
sAlternateActionLabelFood = Eat

;Activate label for applying poisons.
sAlternateActionLabelPoison = Apply


[Ingredients]
bEnabled = true

;0 - Take | 1 - Eat.
iDefaultAction = 0

;
sAlternateActionLabel = Eat


[Scrolls]
bEnabled = true

;0 - Take | 1 - Equip | 2 - Read (cast scrolls).
iDefaultAction = 0

;Legacy-only label for equipping a scroll. SkyPrompt uses Read below.
sAlternateActionLabel = Equip

;SkyPrompt text for reading/casting scrolls. Translate this value as needed.
sAlternateSecondaryActionLabel = Read


[Torches]
bEnabled = true

;0 - Take | 1 - Equip.
iDefaultAction = 0

;
sAlternateActionLabel = Equip


[Ammo]
bEnabled = true

;0 - Take | 1 - Equip.
iDefaultAction = 0

;
sAlternateActionLabel = Equip
